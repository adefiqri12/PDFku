{% extends 'base.html' %}
{% block head_title %}
  Home - PDFku
{% endblock %}
{% block content %}
  <section class="max-w-5xl mx-auto px-4 py-10">
    <div class="mb-10 text-center">
      <h1 class="text-3xl sm:text-4xl font-bold mb-2 py-4">Free online PDF tools</h1>
      <p class="text-base py-4 sm:text-lg text-neutral-300 font-medium">Every tool you need to process PDF files: edit, convert, merge, compress, sign and more.</p>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <!-- Merge PDF -->
      <a href="#" class="group flex flex-col items-center justify-center bg-neutral-800 border border-neutral-700 rounded-2xl p-6 hover:bg-neutral-700 transition shadow-lg">
        <span class="text-4xl mb-3 text-primary group-hover:scale-110 transition-transform"><i class="devicon-google-plain"></i></span>
        <span class="font-semibold text-lg mb-1">Merge PDF</span>
      </a>
      <!-- Split PDF -->
      <a href="#" class="group flex flex-col items-center justify-center bg-neutral-800 border border-neutral-700 rounded-2xl p-6 hover:bg-neutral-700 transition shadow-lg">
        <span class="text-4xl mb-3 text-primary group-hover:scale-110 transition-transform"><i class="devicon-google-plain"></i></span>
        <span class="font-semibold text-lg mb-1">Split PDF</span>
      </a>
      <!-- Compress PDF -->
      <a href="#" class="group flex flex-col items-center justify-center bg-neutral-800 border border-neutral-700 rounded-2xl p-6 hover:bg-neutral-700 transition shadow-lg">
        <span class="text-4xl mb-3 text-primary group-hover:scale-110 transition-transform"><i class="devicon-google-plain"></i></span>
        <span class="font-semibold text-lg mb-1">Compress PDF</span>
      </a>
      <!-- Convert PDF to Word -->
      <a href="#" class="group flex flex-col items-center justify-center bg-neutral-800 border border-neutral-700 rounded-2xl p-6 hover:bg-neutral-700 transition shadow-lg">
        <span class="text-4xl mb-3 text-primary group-hover:scale-110 transition-transform"><i class="devicon-google-plain"></i></span>
        <span class="font-semibold text-lg mb-1">PDF to Word</span>
      </a>
    </div>
  </section>
{% endblock %}
